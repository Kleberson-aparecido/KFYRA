<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Ponto | NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f4;
 color:#18352d;
}
header{
 background:#123d32;
 color:white;
 padding:25px;
}
header h2{margin:0;letter-spacing:3px}
header span{color:#c5a45b}
main{
 max-width:450px;
 margin:50px auto;
 padding:20px;
}
.card{
 background:white;
 padding:30px;
 border-radius:15px;
 box-shadow:0 5px 25px #0001;
}
h1{font-size:25px}
p{color:#788a82;line-height:1.6}
label{
 display:block;
 margin:18px 0 7px;
 font-weight:bold;
 font-size:13px;
}
input{
 width:100%;
 padding:15px;
 border:1px solid #dce6df;
 border-radius:8px;
 font-size:15px;
}
button{
 width:100%;
 padding:16px;
 margin-top:20px;
 background:#123d32;
 color:white;
 border:0;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}
#mensagem{
 display:none;
 padding:12px;
 border-radius:8px;
 margin:15px 0;
 font-size:13px;
}
.erro{display:block!important;background:#fff0ef;color:#a53d35}
.sucesso{display:block!important;background:#eaf7ef;color:#216343}
.oculto{display:none}
</style>
</head>

<body>

<header>
<h2>NEXORA<span>.</span></h2>
<p style="color:#c6ddd1">MEU PONTO • PORTAL DO COLABORADOR</p>
</header>

<main>
<div class="card">

<h1 id="titulo">Bem-vindo ao Meu Ponto</h1>

<p id="subtitulo">
Acesse seu portal individual de colaborador.
</p>

<div id="mensagem"></div>

<form id="formSenha" class="oculto">

<label>Crie sua senha</label>
<input type="password" id="novaSenha"
minlength="8" required placeholder="Mínimo de 8 caracteres">

<label>Confirme sua senha</label>
<input type="password" id="confirmarSenha"
minlength="8" required placeholder="Repita sua senha">

<button type="submit">Criar senha e continuar</button>

</form>

<form id="formLogin">

<label>E-mail</label>
<input type="email" id="email" required>

<label>Senha</label>
<input type="password" id="senha" required>

<button type="submit">Entrar no Meu Ponto</button>

</form>

<div id="areaLogada" class="oculto">
<p id="usuarioLogado"></p>
<button onclick="sair()">Sair da conta</button>
</div>

</div>
</main>

<script>

const SUPABASE_URL =
"https://guiadodxikdvsfrhedls.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_dhAqwNSfwGj8_nBnudx_Hw_gMZpnyEL";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const mensagem = document.getElementById("mensagem");

function mostrarMensagem(texto,tipo){
mensagem.textContent = texto;
mensagem.className = tipo;
}

function abrirPortal(user){

document.getElementById("formLogin").classList.add("oculto");
document.getElementById("formSenha").classList.add("oculto");
document.getElementById("areaLogada").classList.remove("oculto");

document.getElementById("titulo").textContent =
"Meu Ponto";

document.getElementById("subtitulo").textContent =
"Seu acesso está autenticado.";

document.getElementById("usuarioLogado").textContent =
"Conta conectada: "+user.email+
". Os módulos de ponto serão integrados nas próximas etapas.";

}

async function iniciar(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error){
mostrarMensagem(error.message,"erro");
return;
}

if(data.session){

if(window.location.hash.includes("type=invite")){

document.getElementById("formLogin").classList.add("oculto");
document.getElementById("formSenha").classList.remove("oculto");

document.getElementById("titulo").textContent =
"Crie sua senha";

document.getElementById("subtitulo").textContent =
"Seu convite foi validado. Defina sua senha pessoal.";

mostrarMensagem(
"Convite reconhecido! Crie sua senha para continuar.",
"sucesso"
);

}else{

abrirPortal(data.session.user);

}

}

}

document.getElementById("formSenha")
.addEventListener("submit",async function(e){

e.preventDefault();

const senha =
document.getElementById("novaSenha").value;

const confirmar =
document.getElementById("confirmarSenha").value;

if(senha.length < 8){
mostrarMensagem("A senha precisa ter pelo menos 8 caracteres.","erro");
return;
}

if(senha !== confirmar){
mostrarMensagem("As senhas não coincidem.","erro");
return;
}

const {data,error} =
await supabaseClient.auth.updateUser({
password:senha
});

if(error){
mostrarMensagem(error.message,"erro");
return;
}

mostrarMensagem("Senha criada com sucesso!","sucesso");

abrirPortal(data.user);

});

document.getElementById("formLogin")
.addEventListener("submit",async function(e){

e.preventDefault();

const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:document.getElementById("email").value.trim(),

password:document.getElementById("senha").value

});

if(error){
mostrarMensagem("Erro ao entrar: "+error.message,"erro");
return;
}

abrirPortal(data.user);

});

async function sair(){

await supabaseClient.auth.signOut();

window.location.reload();

}

iniciar();

</script>

</body>
</html>
