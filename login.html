<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NEXORA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="index.html" class="logo">NEXORA</a>
        <a href="index.html" class="btn-secondary">Voltar ao início</a>
    </div>
</header>

<main class="container">
    <section class="hero">
        <h1>Bem-vindo à NEXORA</h1>
        <p>Acesse o ambiente exclusivo da sua empresa.</p>

        <form id="formLogin" class="form-container">

            <h2>Entrar na plataforma</h2>

            <label for="email">E-mail corporativo</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="empresa@exemplo.com"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit" class="btn-primary">
                Entrar
            </button>

            <p id="mensagemLogin"></p>

            <p>
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre sua empresa</a>
            </p>

        </form>
    </section>
</main>

<script>
document.getElementById("formLogin").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("mensagemLogin").textContent =
        "A tela de login está preparada. A autenticação segura será conectada ao servidor na próxima etapa.";
});
</script>

</body>
</html>
